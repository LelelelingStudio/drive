<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面走丢了 - 404</title>
    <meta http-equiv="refresh" content="3;url=/index.html">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 4rem; margin: 0; color: #3498db; }
        p { font-size: 1.2rem; margin: 15px 0; color: #7f8c8d; }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>页面走丢了，正在返回主页...</p>
    <a href="/index.html" class="btn">立即返回主页</a>
</body>
</html>
