<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频与音频储存中心</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #3498db;
            --success: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 2rem; margin-bottom: 15px; color: #1a252f; }
        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-box:focus { border-color: var(--primary); }
        
        /* 媒体类型切换 (视频/音频) */
        #type-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        #type-nav button {
            background: white;
            border: 2px solid #ddd;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            transition: all 0.2s;
        }
        #type-nav button.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* 时长分类排版 */
        nav#category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        nav#category-nav button {
            background: #e0e6ed;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            color: #34495e;
        }
        nav#category-nav button:hover, nav#category-nav button.active {
            background: #2c3e50;
            color: white;
        }

        /* 网格排版 */
        #video-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #2c3e50;
            word-wrap: break-word;
        }
        .card-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        .card-desc {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #f9f9f9;
            padding: 8px;
            border-radius: 4px;
        }
        .card-actions { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-play { background-color: var(--primary); color: white; }
        .btn-play:hover { background-color: #2980b9; }
        .btn-download { background-color: var(--success); color: white; }
        .btn-download:hover { background-color: #27ae60; }
        .status-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>📁 媒体储存中心</h1>
        <input type="text" id="search-input" class="search-box" placeholder="搜索标题...">
    </header>

    <!-- 媒体类型切换 -->
    <nav id="type-nav">
        <button class="type-btn active" data-type="all">全部</button>
        <button class="type-btn" data-type="video">🎬 视频</button>
        <button class="type-btn" data-type="audio">🎵 音频</button>
    </nav>

    <nav id="category-nav"></nav>
    
    <main id="video-list">
        <div class="status-msg" id="loading-msg">正在加载数据...</div>
    </main>

    <script src="main.js"></script>
</body>
</html>
